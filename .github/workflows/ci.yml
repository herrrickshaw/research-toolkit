name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements-dev.txt
      - run: ruff check pdf_to_markdown.py categorize.py topic_classify.py smart_classify.py zotero_crud.py tests
      - run: python -m compileall -q .
      - run: pytest -q
      - run: for f in *.sh insights/*.sh; do bash -n "$f"; done
